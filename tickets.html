<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پشتیبانی و تیکت‌ها | مانگاتا</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <style>
        .user-layout { max-width: 1200px; margin: 0 auto; padding: 2rem 1rem; }
        .grid-layout { display: grid; grid-template-columns: 1fr; gap: 1.5rem; }
        @media(min-width: 768px) { .grid-layout { grid-template-columns: 1fr 2fr; } }
        .card { background: var(--bg-surface); padding: 1.5rem; border-radius: var(--radius-lg); border: 1px solid var(--border-color); }
        .ticket-item { padding: 1rem; border: 1px solid var(--border-color); border-radius: var(--radius-md); margin-bottom: 1rem; cursor: pointer; transition: 0.2s; }
        .ticket-item:hover { background: var(--bg-surface-hover); }
        .status-badge { padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
        .status-open { background: var(--error-color); color: white; }
        .status-answered { background: var(--success-color); color: white; }
        .status-closed { background: var(--text-muted); color: white; }
        
        .chat-container { display: flex; flex-direction: column; height: 500px; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 1rem; border: 1px solid var(--border-color); border-radius: var(--radius-md); margin-bottom: 1rem; background: var(--bg-primary); }
        .chat-message { max-width: 80%; padding: 0.75rem 1rem; border-radius: var(--radius-lg); margin-bottom: 1rem; line-height: 1.5; }
        .message-mine { background: var(--accent-color); color: white; align-self: flex-start; border-bottom-right-radius: 0; }
        .message-theirs { background: var(--bg-surface-hover); color: var(--text-primary); align-self: flex-end; border-bottom-left-radius: 0; margin-right: auto; }
        .message-time { font-size: 0.7rem; opacity: 0.7; margin-top: 0.25rem; }
    </style>
</head>
<body>
    <div class="user-layout">
        <h2 style="margin-bottom: 2rem;">پشتیبانی و تیکت‌ها</h2>
        <div id="alert-box" class="alert"></div>

        <div class="grid-layout">
            <!-- Sidebar: Ticket List & Create Ticket -->
            <div>
                <div class="card" style="margin-bottom: 1.5rem;">
                    <h3>ثبت تیکت جدید</h3>
                    <form id="new-ticket-form" onsubmit="createTicket(event)">
                        <div class="input-group">
                            <label>موضوع (خلاصه مشکل)</label>
                            <input type="text" id="ticket_subject" required>
                        </div>
                        <div class="input-group">
                            <label>شرح مشکل</label>
                            <textarea id="ticket_message" required rows="4" style="width: 100%; padding: 0.75rem; background: var(--bg-primary); border: 1px solid var(--border-color); color: white; border-radius: var(--radius-md);"></textarea>
                        </div>
                        <button type="submit" class="btn">ارسال تیکت</button>
                    </form>
                </div>

                <div class="card">
                    <h3>تیکت‌های شما</h3>
                    <div id="tickets-list">
                        <p style="color: var(--text-muted);">در حال بارگذاری...</p>
                    </div>
                </div>
            </div>

            <!-- Main Content: Ticket Chat -->
            <div class="card">
                <h3 id="chat-title">لطفاً یک تیکت انتخاب کنید</h3>
                <div class="chat-container">
                    <div class="chat-messages" id="chat-messages" style="display: flex; flex-direction: column;">
                        <!-- messages will appear here -->
                    </div>
                    <form id="reply-form" onsubmit="replyTicket(event)" style="display: flex; gap: 0.5rem; opacity: 0.5; pointer-events: none;">
                        <input type="text" id="reply_message" placeholder="پیام خود را بنویسید..." style="flex: 1; padding: 0.75rem; border-radius: 30px; background: var(--bg-primary); border: 1px solid var(--border-color); color: white;" required>
                        <button type="submit" class="btn" style="width: auto; padding: 0 1.5rem; border-radius: 30px;">ارسال</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/assets/js/layout.js"></script>
    <script>
        let currentTicketId = null;

        async function loadTickets() {
            try {
                const res = await fetch('/api/tickets/list.php');
                const data = await res.json();
                const list = document.getElementById('tickets-list');
                
                if (res.ok && data.success) {
                    if (data.tickets.length === 0) {
                        list.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem;">تیکتی یافت نشد.</p>';
                        return;
                    }
                    list.innerHTML = '';
                    data.tickets.forEach(t => {
                        let statusClass = 'status-open';
                        let statusText = 'در انتظار پاسخ';
                        if (t.status === 'answered') { statusClass = 'status-answered'; statusText = 'پاسخ داده شده'; }
                        if (t.status === 'closed') { statusClass = 'status-closed'; statusText = 'بسته شده'; }
                        
                        const div = document.createElement('div');
                        div.className = 'ticket-item';
                        div.onclick = () => openTicket(t.id, t.subject, t.status);
                        div.innerHTML = `
                            <div style="display:flex; justify-content:space-between; margin-bottom: 0.5rem;">
                                <strong>${t.subject}</strong>
                                <span class="status-badge ${statusClass}">${statusText}</span>
                            </div>
                            <div style="font-size: 0.8rem; color: var(--text-secondary);">${new Date(t.created_at).toLocaleString('fa-IR')}</div>
                        `;
                        list.appendChild(div);
                    });
                } else {
                    list.innerHTML = `<p style="color:red;">برای مشاهده تیکت‌ها <a href="/login.html">وارد شوید</a>.</p>`;
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function createTicket(e) {
            e.preventDefault();
            const subject = document.getElementById('ticket_subject').value;
            const message = document.getElementById('ticket_message').value;

            try {
                const res = await fetch('/api/tickets/create.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ subject, message })
                });
                const data = await res.json();
                if (res.ok) {
                    alert('تیکت شما ثبت شد');
                    document.getElementById('new-ticket-form').reset();
                    loadTickets();
                } else {
                    alert(data.error);
                }
            } catch (err) {
                alert('خطا در ارتباط با سرور');
            }
        }

        async function openTicket(id, subject, status) {
            currentTicketId = id;
            document.getElementById('chat-title').textContent = subject;
            
            const replyForm = document.getElementById('reply-form');
            if (status === 'closed') {
                replyForm.style.opacity = '0.5';
                replyForm.style.pointerEvents = 'none';
                document.getElementById('reply_message').placeholder = "این تیکت بسته شده است.";
            } else {
                replyForm.style.opacity = '1';
                replyForm.style.pointerEvents = 'auto';
                document.getElementById('reply_message').placeholder = "پیام خود را بنویسید...";
            }

            try {
                const res = await fetch('/api/tickets/messages.php?ticket_id=' + id);
                if (res.ok) {
                    const data = await res.json();
                    const container = document.getElementById('chat-messages');
                    container.innerHTML = '';
                    
                    data.messages.forEach(m => {
                        const isMine = m.is_mine;
                        const div = document.createElement('div');
                        div.className = 'chat-message ' + (isMine ? 'message-mine' : 'message-theirs');
                        div.innerHTML = `
                            <div>${m.message}</div>
                            <div class="message-time">${new Date(m.created_at).toLocaleString('fa-IR')}</div>
                        `;
                        container.appendChild(div);
                    });
                    container.scrollTop = container.scrollHeight;
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function replyTicket(e) {
            e.preventDefault();
            if (!currentTicketId) return;
            const msgInput = document.getElementById('reply_message');
            const message = msgInput.value;

            try {
                const res = await fetch('/api/tickets/reply.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ticket_id: currentTicketId, message })
                });
                if (res.ok) {
                    msgInput.value = '';
                    // re-open ticket to fetch messages
                    openTicket(currentTicketId, document.getElementById('chat-title').textContent);
                }
            } catch (err) {
                alert('خطا در ارسال پیام');
            }
        }

        document.addEventListener('DOMContentLoaded', loadTickets);
    </script>
</body>
</html>
