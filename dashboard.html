<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد کاربری | مانگاتا</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <style>
        .user-layout { max-width: 1200px; margin: 0 auto; padding: 2rem 1rem; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; background: var(--bg-surface); padding: 1.5rem; border-radius: var(--radius-lg); border: 1px solid var(--border-color); }
        .wallet-badge { background: rgba(34, 197, 94, 0.1); color: var(--success-color); padding: 0.5rem 1rem; border-radius: 9999px; font-weight: 600; font-size: 1.1rem; }
        
        .tabs { display: flex; gap: 1rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem; }
        .tab-btn { background: none; border: none; color: var(--text-secondary); font-size: 1rem; cursor: pointer; padding: 0.75rem 1.5rem; border-radius: var(--radius-md); transition: 0.2s; font-weight: 500; }
        .tab-btn:hover { background: var(--bg-surface-hover); }
        .tab-btn.active { background: var(--accent-color); color: white; }
        
        .grid-layout { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; }
        .card { background: var(--bg-surface); padding: 1.5rem; border-radius: var(--radius-lg); border: 1px solid var(--border-color); }
        
        .status-badge { padding: 0.25rem 0.75rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
        .status-badge.pending { background: rgba(234, 179, 8, 0.1); color: #eab308; }
        .status-badge.approved { background: rgba(34, 197, 94, 0.1); color: var(--success-color); }
        .status-badge.rejected { background: rgba(239, 68, 68, 0.1); color: var(--error-color); }
    </style>
</head>
<body>
    <div class="user-layout">
        <div class="header-bar">
            <div>
                <h2 style="font-size: 1.5rem; color: var(--text-primary);">سلام، <span id="user-name" style="color: var(--accent-color);"></span> عزیز!</h2>
                <p style="color: var(--text-secondary); margin-top: 0.5rem; font-size: 0.875rem;">به دپارتمان مطالعه مانگاتا خوش آمدید.</p>
            </div>
            <div style="display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;">
                <div class="wallet-badge">موجودی: <span id="wallet-balance">0</span> تومان</div>
                <button class="btn" style="padding: 0.5rem 1rem; width: auto; background-color: var(--bg-surface-hover);" onclick="logout()">خروج از حساب</button>
            </div>
        </div>
        
        <div id="alert-box" class="alert"></div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('library')">کتابخانه من</button>
            <button class="tab-btn" onclick="switchTab('receipt')">شارژ کیف پول (فیش)</button>
            <a href="/shop.html" class="tab-btn" style="text-decoration: none; display: flex; align-items: center;">رفتن به فروشگاه &rarr;</a>
        </div>

        <!-- Library Section -->
        <div id="tab-library">
            <div class="grid-layout" id="library-container">
                <p style="color: var(--text-muted); padding: 1rem;">در حال بارگذاری کتابخانه امن شما...</p>
            </div>
        </div>

        <!-- Receipt Section -->
        <div id="tab-receipt" style="display: none;">
            <div class="grid-layout">
                <div class="card">
                    <h3 style="margin-bottom: 0.5rem;">ارسال فیش جدید</h3>
                    <p style="font-size: 0.875rem; color: var(--text-muted); margin-bottom: 1.5rem;">شماره کارت سیستم جهت واریز: <strong style="color:var(--text-primary);">۶۰۳۷-۹۹۹۹-۹۹۹۹-۹۹۹۹</strong></p>
                    
                    <form id="receipt-form">
                        <div class="input-group">
                            <label>مبلغ پرداخت شده (تومان)</label>
                            <input type="number" id="receipt_amount" required min="1000" placeholder="حداقل ۱,۰۰۰ تومان">
                        </div>
                        <div class="input-group">
                            <label>تصویر فیش (رسید واریز)</label>
                            <input type="file" id="receipt_image" accept=".jpg, .jpeg, .png, .webp" required style="padding: 0.5rem; background: var(--bg-primary);">
                        </div>
                        <button type="submit" class="btn">ارسال فیش برای بررسی</button>
                    </form>
                </div>
                
                <div class="card">
                    <h3 style="margin-bottom: 1.5rem;">تاریخچه تراکنش‌های من</h3>
                    <div id="receipts-history"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="/assets/js/dashboard.js"></script>
</body>
</html>
